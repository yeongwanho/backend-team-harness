// Copy into build.gradle. Architecture tests stay in src/test and get an isolated report directory.
tasks.register('architectureTest', Test) {
    description = 'Runs executable architecture rules with isolated JUnit evidence.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching '*ArchitectureTest'
    }
    shouldRunAfter tasks.test
}

tasks.named('test', Test) {
    filter {
        excludeTestsMatching '*ArchitectureTest'
    }
}
